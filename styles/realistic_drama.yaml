id: realistic_drama
name: "Drama realista contemporâneo"
style_block: "Contemporary realistic cinematic drama, shot like high-end vertical smartphone footage, natural available light, soft film grain, realistic skin texture with visible pores, shallow depth of field, slightly muted natural colors, present-day Brazilian setting and everyday modern clothing, vertical 9:16"
style_block_pt: "Drama cinematográfico realista contemporâneo, filmado como vídeo vertical de smartphone de alto padrão, luz natural disponível, granulação suave de filme, textura de pele realista com poros visíveis, profundidade de campo rasa, cores naturais levemente suaves, cenário brasileiro atual e roupas modernas do dia a dia, vertical 9:16"
negative_hints: "no text, no watermark, no extra fingers, no plastic or over-smoothed skin, no stylized illustration, no retro or vintage look"
negative_hints_pt: "sem texto, sem marca d'água, sem dedos extras, sem pele plástica ou excessivamente alisada, sem ilustração estilizada, sem aparência retrô ou vintage"
camera_defaults: "slight handheld camera feel"
camera_defaults_pt: "leve sensação de câmera na mão"
video_motion_defaults: "subtle natural motion"
video_motion_defaults_pt: "movimento natural sutil"
notes: "Bom para drama, vingança e romance contemporâneos. Evitar movimento exagerado em rostos."
character_rules: "Describe people with realistic features and simple everyday clothing."
audio_style: "clean dialogue in Brazilian Portuguese, natural room tone, no background music, no laugh track, no on-screen text"
audio_style_pt: "áudio limpo em português do Brasil, som natural do ambiente, sem música de fundo, sem risadas de fundo, sem texto na tela"
character_rules_pt: "Descrever pessoas com traços realistas e roupas simples do dia a dia."
